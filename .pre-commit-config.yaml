repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.6
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format
  - repo: local
    hooks:
      - id: adr-index
        name: adr-index
        entry: python scripts/check_adr_index.py
        language: python
        pass_filenames: false
      - id: adr-lint
        name: adr-lint
        entry: python scripts/lint_adrs.py
        language: python
        pass_filenames: false
      - id: print-guard
        name: print-guard
        entry: bash scripts/check_prints.sh
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: bash -c 'mypy curaflow tests scripts'
        language: system
        pass_filenames: false
        types: [python]
      - id: fast-tests
        name: fast-tests
        entry: bash scripts/fast_tests.sh
        language: system
        pass_filenames: false
        stages: [pre-push]
