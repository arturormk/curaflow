[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "curaflow"
version = "0.2.0"
description = "Incremental, parallel fetch→normalize→build pipeline with hierarchical fanout for web-curated data."
authors = [{name="Control Equis", email="hello@controlequis.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "PyYAML>=6.0",
  "typer[all]>=0.12",
  "rich>=13.7",
  "beautifulsoup4>=4.12",
  "lxml>=5.2"
]

[project.scripts]
curaflow = "curaflow.cli:app"
