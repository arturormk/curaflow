[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "curaflow"
version = "1.0.0"
description = "Incremental, parallel fetch→normalize→build pipeline with hierarchical fanout for web-curated data."
authors = [{name="Control Equis", email="hello@controlequis.com"}]
license = "MIT"
license-files = ["LICENSE", "AUTHORS"]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "PyYAML>=6.0",
  "typer>=0.12",
  "rich>=13.7",
  "beautifulsoup4>=4.12",
  "lxml>=5.2",
  "pyexcel-ods3>=0.6.1"
]

[tool.setuptools]
# Let setuptools automatically find all packages and subpackages

[project.scripts]
curaflow = "curaflow.cli:app"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "PIE", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
show_error_codes = true
ignore_missing_imports = true  # Relax initially; tighten per-module later
